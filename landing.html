<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blank-Slate</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #111111;
    color: #e0e0e0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    /* FRC page grid */
    background-image:
      linear-gradient(rgba(240, 201, 180, 0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(240, 201, 180, 0.05) 1px, transparent 1px);
    background-size: 32px 32px;
  }

  .container {
    width: 500px;
    max-height: 80vh;
    display: flex;
    flex-direction: column;
  }

  h1 {
    font-size: 28px;
    font-weight: 300;
    color: #ffffff;
    margin-bottom: 8px;
    letter-spacing: 1px;
  }

  .subtitle {
    color: #666;
    font-size: 13px;
    margin-bottom: 32px;
  }

  .btn {
    background: #F0C4A0;
    color: #1a1a1a;
    border: none;
    padding: 12px 24px;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
  }

  .btn:hover { background: #f5d4b8; }

  .create-row {
    display: flex;
    gap: 10px;
    margin-bottom: 32px;
  }

  .create-row input {
    flex: 1;
    background: #1a1a1a;
    border: 1px solid #29251f;
    color: #e0e0e0;
    padding: 12px 16px;
    border-radius: 6px;
    font-size: 14px;
    outline: none;
    transition: border-color 0.15s;
  }

  .create-row input:focus {
    border-color: #F0C4A0;
  }

  .create-row input::placeholder { color: #555; }

  .divider {
    height: 1px;
    background: #29251f;
    margin-bottom: 24px;
  }

  .section-label {
    color: #666;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 12px;
  }

  .project-list {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .project-list::-webkit-scrollbar { width: 6px; }
  .project-list::-webkit-scrollbar-track { background: transparent; }
  .project-list::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }

  .project-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    background: rgba(23, 22, 20, 0.85);
    border: 1px solid #29251f;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.15s;
  }

  .project-item:hover { background: #241f19; }

  .project-name {
    font-size: 14px;
    font-weight: 500;
  }

  .project-date {
    font-size: 12px;
    color: #555;
  }

  .project-actions {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .project-shortcut,
  .project-delete {
    background: none;
    border: none;
    color: #555;
    cursor: pointer;
    font-size: 16px;
    padding: 4px 8px;
    border-radius: 4px;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .project-shortcut:hover {
    color: #F0C4A0;
    background: rgba(240,196,160,0.1);
  }

  .project-delete:hover {
    color: #ff6b6b;
    background: rgba(255,107,107,0.1);
  }

  .empty-state {
    color: #444;
    font-size: 14px;
    text-align: center;
    padding: 40px 0;
  }
</style>
</head>
<body>

<div class="container">
  <h1>Blank-Slate</h1>
  <p class="subtitle">Drop images, add text, build boards. Every tool is a file you can remix.</p>

  <div class="create-row">
    <input type="text" id="projectNameInput" placeholder="New project name..."
           maxlength="60" autofocus>
    <button class="btn" id="createBtn">Create</button>
  </div>

  <div class="divider"></div>
  <div class="section-label">Recent Projects</div>

  <div class="project-list" id="projectList">
    <div class="empty-state">No projects yet</div>
  </div>
</div>

<script>
  const input = document.getElementById('projectNameInput');
  const createBtn = document.getElementById('createBtn');
  const projectList = document.getElementById('projectList');

  async function loadProjects() {
    const projects = await window.api.getProjects();
    if (projects.length === 0) {
      projectList.innerHTML = '<div class="empty-state">No projects yet</div>';
      return;
    }

    projectList.innerHTML = projects.map(p => {
      const date = p.modified ? new Date(p.modified).toLocaleDateString('en-US', {
        month: 'short', day: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit'
      }) : '';
      return `
        <div class="project-item" data-name="${p.name}">
          <div>
            <div class="project-name">${p.name}</div>
            <div class="project-date">${date}</div>
          </div>
          <div class="project-actions">
            <button class="project-shortcut" data-shortcut="${p.name}" title="Save desktop shortcut (.bat)">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
            </button>
            <button class="project-delete" data-delete="${p.name}" title="Delete project">&times;</button>
          </div>
        </div>
      `;
    }).join('');

    // Open project on click
    projectList.querySelectorAll('.project-item').forEach(el => {
      el.addEventListener('click', (e) => {
        if (e.target.closest('.project-delete')) return;
        if (e.target.closest('.project-shortcut')) return;
        window.api.openCanvas(el.dataset.name);
      });
    });

    // Create shortcut (.bat launcher)
    projectList.querySelectorAll('.project-shortcut').forEach(el => {
      el.addEventListener('click', async (e) => {
        e.stopPropagation();
        const name = el.dataset.shortcut;
        const result = await window.api.createShortcut(name);
        if (result && result.success) {
          const btn = el;
          const prevHTML = btn.innerHTML;
          btn.innerHTML = '&#10003;';
          setTimeout(() => { btn.innerHTML = prevHTML; }, 1500);
        } else if (result && result.error) {
          alert('Could not save shortcut: ' + result.error);
        }
      });
    });

    // Delete project
    projectList.querySelectorAll('.project-delete').forEach(el => {
      el.addEventListener('click', async (e) => {
        e.stopPropagation();
        const name = el.dataset.delete;
        if (confirm(`Delete "${name}"? This cannot be undone.`)) {
          await window.api.deleteProject(name);
          loadProjects();
        }
      });
    });
  }

  async function createProject() {
    const name = input.value.trim();
    if (!name) { input.focus(); return; }

    const result = await window.api.createProject(name);
    if (result.error) {
      alert(result.error);
      return;
    }
    window.api.openCanvas(result.name);
  }

  createBtn.addEventListener('click', createProject);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') createProject();
  });

  loadProjects();
</script>

</body>
</html>
