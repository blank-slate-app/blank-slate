<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Blank-Slate</title>
<style>
  /* ═══════════════════════════════════════════════════════════════════
     KERNEL CHROME — FRC tool style (page grid, floating canvas, icon rail)
     Tool-specific CSS is injected at load by each tool file; nothing
     tool-specific belongs in this stylesheet.
     ═══════════════════════════════════════════════════════════════════ */
  :root {
    --font-serif: 'Cormorant Garamond', Georgia, serif;
    --font-sans: 'Inter', 'Helvetica Neue', sans-serif;
    --mono: "JetBrains Mono", "Cascadia Code", ui-monospace, Menlo, Consolas, monospace;
    --peach: #F0C4A0;
    --bg: #1a1a1a;
    /* FRC tokens */
    --frc-line: #29251f;
    --frc-peach-100: #F05300;
    --frc-peach-25: #F0C9B4;
    --frc-dim: rgba(240, 240, 240, 0.5);
    --frc-faint: rgba(240, 240, 240, 0.35);
    --frc-canvas-bg: rgba(17, 17, 17, 0.6);
    --frc-canvas-shadow: 0 10px 44px rgba(0, 0, 0, 0.55), 0 2px 10px rgba(0, 0, 0, 0.4);
    /* stage padding for the floating canvas (visual only — the #viewport box
       and all coordinate math are untouched; the panel is cut via clip-path).
       stage-left clears the 52px LEFT rail (Decks/Tools) + 6px gap — a
       paint-only change; the #viewport box still spans the full window. */
    --stage-top: 42px; --stage-bottom: 42px; --stage-left: 58px; --stage-rail-gap: 6px;
  }

  /* Side panel open: the canvas ZONE yields — its painted left edge slides
     right so panel and canvas sit side by side (panel at 58px, 380 wide,
     14px gap → 452). PAINT ONLY: the #viewport box never moves; the kernel compensates
     panX by the same 394px so content moves WITH its zone (and subtracts
     that compensation when saving). Keep 452px in sync with STAGE_LEFT_PANEL
     in js/engine.js. */
  body.panel-open { --stage-left: 452px; }

  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }

  body {
    /* FRC page layer: #111 with the faint peach 32px drafting grid */
    background-color: #111111;
    background-image:
      linear-gradient(rgba(240, 201, 180, 0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(240, 201, 180, 0.05) 1px, transparent 1px);
    background-size: 32px 32px;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
    font-family: var(--font-sans);
  }

  /* FRC two-layer canvas: hairline frame + double drop shadow, drawn as an
     overlay so the working canvas keeps its exact box and coordinates */
  body::after {
    content: '';
    position: fixed;
    top: var(--stage-top);
    left: var(--stage-left);
    right: calc(52px + var(--stage-rail-gap));
    bottom: var(--stage-bottom);
    border: 1px solid var(--frc-line);
    border-radius: 10px;
    box-shadow: var(--frc-canvas-shadow);
    pointer-events: none;
    z-index: 999;
    transition: left 200ms ease; /* follows the zone push */
  }

  /* ── Viewport & World ──
     NEVER move the #viewport box: screenToWorld, zoom anchoring and every
     pointer interaction assume it fills the window minus the 52px rail.
     The floating-panel look comes from clip-path, which trims paint only. */
  #viewport {
    position: absolute;
    inset: 0;
    right: 52px;
    overflow: hidden;
    cursor: default;
    background: var(--frc-canvas-bg);
    clip-path: inset(var(--stage-top) var(--stage-rail-gap) var(--stage-bottom) var(--stage-left) round 10px);
    transition: clip-path 200ms ease; /* zone push when a side panel opens */
  }
  #viewport.panning { cursor: grab; }
  #viewport.panning:active { cursor: grabbing; }

  #world {
    position: absolute;
    width: 0; height: 0;
    transform-origin: 0 0;
  }
  /* Transient: lets the pan compensation glide alongside the zone push.
     Added/removed by the kernel around panel open/close only — never left
     on, or live panning would lag. */
  #world.panel-anim { transition: transform 200ms ease; }

  /* No canvas grid layer — deliberately. The only visible grid is the 32px
     page grid on <body> reading through the translucent panel (exactly like
     the original Sketchbook). The 40px snap grid is invisible. Adding a
     second, zoom-scaled grid here creates the "double grid" artifact. */

  /* ── Objects (kernel base — tools style their own types) ── */
  .canvas-obj {
    position: absolute;
    min-width: 20px;
    min-height: 20px;
    cursor: move;
  }
  .canvas-obj.selected {
    outline: 3px solid var(--peach);
    outline-offset: 2px;
  }
  /* Unknown object type (its tool isn't installed): inert labeled box */
  .canvas-obj.placeholder-obj {
    border: 2px dashed #555;
    background: rgba(255,255,255,0.03);
    color: #777;
    font-family: var(--mono);
    font-size: 11px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 8px;
  }

  .resize-handle {
    position: absolute;
    width: 12px;
    height: 12px;
    background: var(--peach);
    border: 2px solid var(--bg);
    border-radius: 2px;
    z-index: 10;
    display: none;
  }
  .canvas-obj.selected .resize-handle { display: block; }
  .resize-handle.rh-tl { top: -8px; left: -8px; cursor: nw-resize; }
  .resize-handle.rh-tr { top: -8px; right: -8px; cursor: ne-resize; }
  .resize-handle.rh-bl { bottom: -8px; left: -8px; cursor: sw-resize; }
  .resize-handle.rh-br { bottom: -8px; right: -8px; cursor: se-resize; }

  /* ── Snap guides & marquee ── */
  .snap-guide {
    position: absolute;
    background: var(--peach);
    opacity: 0.5;
    z-index: 9999;
    pointer-events: none;
  }
  .snap-guide.horizontal { height: 1px; left: -999999px; right: -999999px; }
  .snap-guide.vertical   { width: 1px; top: -999999px; bottom: -999999px; }

  #selectRect {
    position: absolute;
    border: 1px solid var(--peach);
    background: rgba(240, 196, 160, 0.08);
    display: none;
    pointer-events: none;
    z-index: 9998;
  }

  /* ── FRC icon rail (toolbar) — states are COLOR ONLY ── */
  #toolbar {
    position: fixed;
    top: 0; right: 0;
    width: 52px; height: 100vh;
    background: transparent;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 12px 0;
    gap: 4px;
    z-index: 1000;
  }
  .tool-btn {
    width: 40px; height: 40px;
    background: none;
    border: none;
    color: var(--frc-faint);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: color 150ms ease;
    position: relative;
  }
  .tool-btn:hover { color: var(--frc-dim); }
  .tool-btn.active { color: var(--frc-peach-25); }
  .tool-btn svg {
    width: 20px; height: 20px;
    stroke: currentColor; fill: none;
    stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
  }
  .tool-btn[title]:hover::after {
    content: attr(title);
    position: absolute; right: 52px;
    background: #2a2a2a; color: #e0e0e0;
    padding: 6px 10px; border-radius: 4px;
    font-size: 12px; white-space: nowrap; pointer-events: none;
    z-index: 1001;
  }
  .toolbar-spacer { flex: 1; }
  .toolbar-divider { width: 28px; height: 1px; background: var(--frc-line); margin: 4px 0; }

  /* Family flyout: hover a rail button to reveal its subfamily entries,
     mirroring the right-click menu's family → subfamily hierarchy.
     Shown via visibility+opacity with a hide DELAY (grace period), and an
     invisible ::after bridge spans the gap to the button — both so the
     cursor can travel from button to flyout without it vanishing. */
  .tool-wrap { position: relative; }
  .tool-flyout {
    position: absolute;
    right: 46px;
    /* -22px lifts the panel so the FIRST item row sits in line with the
       family button, leaving the title caption above that line */
    top: -22px;
    background: #2a2a2a;
    border: 1px solid #3a3a3a;
    border-radius: 8px;
    padding: 4px;
    min-width: 150px;
    z-index: 1002;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    visibility: hidden;
    opacity: 0;
    transition: opacity 120ms ease, visibility 0s linear 200ms;
  }
  .tool-flyout::after {
    content: '';
    position: absolute;
    top: 0;
    bottom: 0;
    left: 100%;
    width: 14px; /* bridges the gap to the rail button */
  }
  .tool-wrap:hover .tool-flyout {
    visibility: visible;
    opacity: 1;
    transition: opacity 120ms ease;
  }
  .tool-flyout-title {
    padding: 6px 14px 4px;
    color: #777;
    font-size: 10px;
    font-family: var(--mono);
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }
  .tool-flyout .ctx-item.active { color: var(--frc-peach-25); }

  /* ── LEFT rail (app chrome: Decks / Tools panels) ── */
  #leftbar {
    position: fixed;
    top: 0; left: 0;
    width: 52px; height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 12px 0;
    gap: 4px;
    z-index: 1000;
  }
  #leftbar .tool-btn[title]:hover::after { right: auto; left: 52px; }

  /* ── Side panel (floating card beside the left rail) ── */
  .side-panel {
    position: fixed;
    top: var(--stage-top);
    bottom: var(--stage-bottom);
    left: 58px;
    width: 380px;
    /* same translucent layer as the canvas zone — the page grid reads
       through both, so panel and canvas feel like one surface family */
    background: var(--frc-canvas-bg);
    border: 1px solid var(--frc-line);
    border-radius: 10px;
    box-shadow: var(--frc-canvas-shadow);
    z-index: 1050;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    visibility: hidden;
    opacity: 0;
    transform: translateX(-14px);
    transition: opacity 150ms ease, transform 150ms ease, visibility 0s linear 150ms;
  }
  .side-panel.open {
    visibility: visible;
    opacity: 1;
    transform: translateX(0);
    transition: opacity 150ms ease, transform 150ms ease;
  }
  .sp-head {
    display: flex; align-items: baseline; gap: 8px;
    padding: 14px 16px;
    border-bottom: 1px solid var(--frc-line);
    flex: 0 0 auto;
  }
  .sp-head .sp-title { font-size: 13px; font-weight: 600; color: #eee; letter-spacing: 0.04em; }
  .sp-head .sp-count { font-size: 11px; color: #555; font-family: var(--mono); margin-left: auto; }
  /* No close button — the rail button toggles, Esc closes. */
  .sp-search {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 12px 14px 0;
    padding: 7px 10px;
    background: rgba(23, 22, 20, 0.85);
    border: 1px solid var(--frc-line);
    border-radius: 6px;
  }
  .sp-search svg { width: 13px; height: 13px; stroke: #5a544c; fill: none; stroke-width: 2; stroke-linecap: round; flex: 0 0 auto; }
  .sp-search input {
    flex: 1 1 auto;
    background: transparent;
    border: none;
    outline: none;
    color: #e0e0e0;
    font-size: 12.5px;
    font-family: var(--font-sans);
  }
  .sp-search input::placeholder { color: #555; }
  .sp-body { flex: 1 1 auto; overflow-y: auto; padding: 14px; }
  .sp-body::-webkit-scrollbar { width: 8px; }
  .sp-body::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 4px; }
  .sp-body::-webkit-scrollbar-thumb:hover { background: #3a3a3a; }
  .sp-empty { text-align: center; color: #666; font-size: 12.5px; line-height: 1.8; margin-top: 8vh; padding: 0 10px; }
  .sp-empty h3 { font-weight: 300; color: #aaa; font-size: 16px; margin-bottom: 8px; }
  .sp-foot {
    flex: 0 0 auto;
    padding: 10px 16px;
    border-top: 1px solid var(--frc-line);
    color: #555; font-size: 10.5px; font-family: var(--mono); letter-spacing: 0.05em;
  }

  /* Deck cards (Decks panel) */
  /* No card bubble — cover and caption sit directly on the panel */
  .deck-card { margin-bottom: 18px; }

  .sp-section {
    font-size: 10px;
    font-family: var(--mono);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #77685a;
    margin: 6px 2px 10px;
  }
  .sp-section:not(:first-child) { margin-top: 22px; }
  .sp-note { color: #666; font-size: 12px; line-height: 1.6; margin: 2px 2px 14px; }

  .dk-get {
    position: absolute;
    right: 8px; bottom: 8px;
    width: 28px; height: 28px;
    border-radius: 50%;
    background: rgba(17, 17, 17, 0.85);
    border: 1px solid var(--frc-line);
    color: var(--peach);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    z-index: 3;
    transition: transform 120ms ease, border-color 120ms ease;
  }
  .dk-get svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .dk-get:hover { transform: scale(1.1); border-color: #4a4038; }

  .tr-get {
    flex: 0 0 auto;
    width: 26px; height: 26px;
    border-radius: 50%;
    background: transparent;
    border: 1px solid var(--frc-line);
    color: var(--peach);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    font-size: 12px;
  }
  .tr-get svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .tr-get:hover { border-color: #4a4038; background: rgba(240, 196, 160, 0.08); }
  .tr-get.done { color: #666; cursor: default; }

  .dk-import {
    width: 100%;
    margin-bottom: 14px;
    padding: 8px 12px;
    background: rgba(240, 196, 160, 0.08);
    border: 1px dashed var(--frc-line);
    border-radius: 8px;
    color: #9a8a7a;
    font-size: 12.5px;
    font-family: var(--font-sans);
    cursor: pointer;
    transition: color 0.15s, border-color 0.15s;
  }
  .dk-import:hover { color: var(--peach); border-color: #4a4038; }
  .deck-thumb {
    position: relative;
    aspect-ratio: 16 / 9; /* landscape deck pages */
    background: #0d0d0d;
    border: 1px solid var(--frc-line);
    border-radius: 8px;
    overflow: hidden; /* clips the oversized iframe (and rounds corners) */
  }
  .deck-thumb .ph { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  .deck-thumb .ph svg { width: 40px; height: 40px; stroke: #333; fill: none; stroke-width: 1.5; }
  .deck-thumb iframe {
    position: absolute; top: 0; left: 0;
    /* +17px: multi-page PDFs always show the viewer's vertical document
       scrollbar. Oversizing by one scrollbar-width pushes it outside the
       clipped thumb, and the viewer's CONTENT area (viewport minus
       scrollbar) lands exactly on the visible box. */
    width: calc(100% + 17px);
    height: 100%;
    border: 0; pointer-events: none; /* display only — paging is via the arrows */
  }
  /* Page arrows — the deck's only UI. Revealed on card hover. */
  .deck-arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 26px; height: 26px;
    border-radius: 50%;
    background: rgba(17, 17, 17, 0.82);
    border: 1px solid var(--frc-line);
    color: #aaa;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    opacity: 0;
    transition: opacity 120ms ease, color 120ms ease, border-color 120ms ease;
    z-index: 2;
  }
  .deck-arrow svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
  .deck-arrow.prev { left: 8px; }
  .deck-arrow.next { right: 8px; }
  .deck-card:hover .deck-arrow { opacity: 1; }
  .deck-arrow:hover { color: var(--peach); border-color: #4a4038; }
  .deck-arrow.disabled { opacity: 0.25 !important; cursor: default; color: #666; }
  /* Library-style caption: title, then author · downloads · tools */
  .deck-meta { padding: 10px 2px 0; }
  .deck-meta .name { font-size: 13px; font-weight: 600; color: #eee; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dk-stats { display: flex; align-items: center; gap: 12px; margin-top: 3px; font-size: 11.5px; color: #666; }
  .dk-stat { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
  .dk-stat svg {
    width: 12px; height: 12px;
    stroke: #5a544c; fill: none;
    stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
  }

  /* Tool rows (Tools panel) — thumbnail tile · title + author · category */
  .tool-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 7px 6px;
    border-radius: 8px;
  }
  .tool-row:hover { background: rgba(240, 196, 160, 0.06); }
  .tool-row .tr-thumb {
    flex: 0 0 auto;
    width: 38px; height: 38px;
    border-radius: 9px;
    background: #221f1a;
    border: 1px solid var(--frc-line);
    display: flex; align-items: center; justify-content: center;
  }
  .tool-row .tr-thumb svg {
    width: 18px; height: 18px;
    stroke: var(--frc-peach-25); fill: none;
    stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
  }
  .tool-row .tr-lines { flex: 1 1 auto; min-width: 0; }
  .tool-row .tr-name { font-size: 13px; font-weight: 600; color: #eee; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* Sub-line: [category icon] | By Author  [person] downloads */
  .tool-row .tr-sub {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: #666;
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
  }
  .tool-row .tr-sub svg {
    width: 12px; height: 12px;
    stroke: #5a544c; fill: none;
    stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
    flex: 0 0 auto;
  }
  .tool-row .tr-sep { color: #3a352e; }
  .tool-row .tr-dl { display: inline-flex; align-items: center; gap: 3px; margin-left: 4px; }

  /* ── Menus (generated by the kernel from tool registrations) ── */
  .ctx-menu {
    display: none;
    position: fixed;
    background: #2a2a2a;
    border: 1px solid #3a3a3a;
    border-radius: 8px;
    padding: 4px;
    min-width: 180px;
    z-index: 2000;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  .ctx-item {
    padding: 8px 14px; color: #ccc; font-size: 13px;
    font-family: var(--font-sans); cursor: pointer;
    border-radius: 4px; display: flex; align-items: center; gap: 10px;
  }
  .ctx-item:hover { background: #363636; color: #fff; }
  .ctx-item.danger { color: #ff6b6b; }
  .ctx-item.danger:hover { background: rgba(255,107,107,0.1); }
  .ctx-item.disabled { color: #555; cursor: default; }
  .ctx-item.disabled:hover { background: none; }
  .ctx-divider { height: 1px; background: #3a3a3a; margin: 4px 0; }
  .ctx-item .check { margin-left: auto; font-size: 12px; color: var(--peach); }
  .align-respace-check { cursor: pointer; gap: 8px; }
  .align-respace-check input { accent-color: var(--peach); width: 14px; height: 14px; cursor: pointer; }
  .align-respace-check span { font-size: 12px; color: #888; }
  .ctx-sub { position: relative; }
  .ctx-sub-menu {
    display: none; position: absolute; left: 100%; top: -4px;
    background: #2a2a2a; border: 1px solid #3a3a3a;
    border-radius: 8px; padding: 4px; min-width: 160px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  .ctx-sub:hover .ctx-sub-menu { display: block; }
  .ctx-item .arrow { margin-left: auto; font-size: 10px; color: #666; }

  /* ── Rename-project popup (opened from the rail's pencil button) ── */
  .rename-panel {
    position: fixed;
    right: 60px; /* top set at open time, beside the rail button */
    background: #2a2a2a;
    border: 1px solid #3a3a3a;
    border-radius: 8px;
    padding: 10px 12px;
    z-index: 2100;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    display: flex;
    flex-direction: column;
    gap: 8px;
    width: 240px;
  }
  .rename-panel span { color: #888; font-size: 11px; font-family: var(--mono); letter-spacing: 0.08em; text-transform: uppercase; }
  .rename-panel input {
    background: #1a1a1a;
    border: 1px solid var(--peach);
    border-radius: 4px;
    color: #e0e0e0;
    padding: 7px 9px;
    font-size: 13px;
    font-family: var(--font-sans);
    outline: none;
  }
  .rename-panel .rp-hint { color: #555; font-size: 10.5px; }

  /* ── Bottom bar slot (tools mount their bars here) ── */
  #barSlot {
    position: fixed;
    bottom: 60px;
    left: calc(50% - 26px);
    transform: translateX(-50%);
    z-index: 1001;
  }

  /* ── Toast & indicators ── */
  .toast {
    position: fixed;
    bottom: 60px;
    left: calc(50% - 26px);
    transform: translateX(-50%) translateY(80px);
    background: #171614;
    border: 1px solid var(--frc-line);
    color: #e0e0e0;
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 13px;
    font-family: var(--font-sans);
    display: flex;
    align-items: center;
    gap: 8px;
    z-index: 3000;
    opacity: 0;
    visibility: hidden;
    transition: transform 150ms ease, opacity 150ms ease, visibility 150ms;
    max-width: 60vw;
  }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; visibility: visible; }
  .toast-icon { color: var(--frc-peach-25); flex-shrink: 0; }

  #zoomIndicator {
    position: fixed;
    bottom: 12px; left: 16px;
    color: var(--frc-faint);
    font-size: 11px;
    font-family: var(--mono);
    letter-spacing: 0.08em;
    z-index: 1000;
    pointer-events: none;
  }
  #saveIndicator {
    position: fixed;
    top: 12px; left: 16px;
    color: var(--frc-faint);
    font-size: 10px;
    font-family: var(--mono);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    z-index: 1000;
    opacity: 0;
    transition: opacity 150ms ease;
    pointer-events: none;
  }
  #saveIndicator.show { opacity: 1; }
</style>
</head>
<body>

<div id="viewport">
  <div id="world">
    <!-- selectRect must live INSIDE #world: the marquee positions it in
         world coordinates, so it needs the pan/zoom transform. Kept safe
         from renderObjects(), which only removes .canvas-obj elements. -->
    <div id="selectRect"></div>
  </div>
</div>

<div id="toolbar"></div>
<div id="leftbar"></div>

<div class="side-panel" id="sidePanel">
  <div class="sp-head">
    <span class="sp-title" id="spTitle"></span>
    <span class="sp-count" id="spCount"></span>
  </div>
  <div class="sp-search">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" id="spSearch" placeholder="Search">
  </div>
  <div class="sp-body" id="spBody"></div>
  <div class="sp-foot" id="spFoot"></div>
</div>

<div id="barSlot"></div>

<div class="toast" id="toast">
  <svg class="toast-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg>
  <span id="toastMsg"></span>
</div>

<div id="zoomIndicator">100%</div>
<div id="saveIndicator">Saved</div>

<script type="module" src="../js/engine.js"></script>

</body>
</html>
